<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giám Sát Phát Hiện Tai Nạn</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --background-color: #f4f6f9;
            --text-color: #2c3e50;
            --border-color: #e0e4e8;
            --error-color: #e74c3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .detection-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .detection-wrapper {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 30px;
        }

        .detection-header {
            grid-column: 1 / -1;
            text-align: center;
            margin-bottom: 20px;
        }

        .detection-header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .video-section {
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--border-color);
        }

        .video-feed {
            width: 100%;
            border-radius: 10px;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 4 / 3; 
            max-height: 400px; 
            margin-bottom: 20px;
            overflow: hidden;
        }

        #videoFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: black;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #555f66;
        }

        .threshold-control {
            grid-column: 1 / -1;
            background-color: #f1f2f6;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .threshold-control label {
            margin-right: 15px;
            font-weight: 600;
        }

        .tooltip-container {
            position: relative;
            display: inline-block;
            cursor: help; /* Hiển thị dấu hỏi khi hover */
        }
    
        .tooltip-icon {
            font-weight: bold;
            color: red; /* Màu xanh để nổi bật */
            margin-left:2px;
            font-size: 14px;
        }
    
        .tooltip-text {
            visibility: hidden;
            width: 300px;
            background-color: rgba(0, 0, 0, 0.75);
            color: #fff;
            text-align: left;
            padding: 8px;
            border-radius: 5px;
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 14px;
            white-space: normal;
        }
    
        .tooltip-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        #confidenceThreshold {
            flex-grow: 1;
            margin-right: 15px;
        }

        .accidents-section {
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--border-color);
        }

        .accidents-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .status {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .status-connected {
            background-color: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
        }

        .status-disconnected {
            background-color: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
        }
        .detection-details {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .detail-item {
            background-color: #f1f2f6;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .accident-item {
            background-color: #f1f2f6;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .accident-item:hover {
            background-color: #e6e8f0;
        }
        
        .accident-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .accident-time {
            font-weight: 600;
            color: var(--text-color);
        }
        
        .accident-confidence {
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .accident-details {
            color: #6c757d;
        }
        .accidents-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .accidents-actions {
            display: flex;
            align-items: center;
        }
        
        .accidents-actions .btn {
            padding: 8px 15px;
            font-size: 0.9em;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .accident-modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 1200px;
            width: 95%;
            display: flex;
            flex-direction: column;
            max-height: 67vh;
        }

        .modal-body {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex: 1;
            min-height: 0;
        }

        .detection-preview {
            flex: 2;
            display: flex;
            flex-direction: column;
            padding: 0px 10px 0px 10px;
            gap: 8px;
            min-height: 0;
        }

        .detection-preview img {
            max-width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
        }

        .detection-details {
            flex: 1;
            padding: 0 20px;
            border-left: 1px solid #e5e7eb;
            overflow-y: auto;
        }

        .emergency-contacts {
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            flex: 1;
        }
        .modal-footer {
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            width: 100%;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="detection-container">
        <div class="detection-wrapper">
            <div class="detection-header">
                <h1>HỆ THỐNG GIÁM SÁT PHÁT HIỆN TAI NẠN</h1>
                <div id="status" class="status status-disconnected">Chưa Kết Nối</div>
            </div>

            <div class="video-section">
                <div class="video-feed">
                    <img id="videoFeed" src="" alt="Luồng Video">
                </div>
                
                <div class="controls">
                    <button id="startDetection" class="btn btn-primary">Bắt Đầu Phát Hiện</button>
                    <button id="stopDetection" class="btn btn-secondary">Dừng Phát Hiện</button>
                </div>

                <div class="threshold-control">
                    <label for="confidenceThreshold">
                        <span class="tooltip-container">
                            Ngưỡng phát hiện:
                            <span class="tooltip-icon">*</span>
                            <span class="tooltip-text">
                                Điều chỉnh ngưỡng phát hiện giúp cân bằng giữa độ nhạy và độ chính xác của hệ thống. 
                                <br><br>
                                - Ngưỡng thấp (< 0.5): Phát hiện nhiều tai nạn hơn nhưng có thể gây cảnh báo sai.  
                                <br>
                                - Ngưỡng cao (> 0.8): Giảm cảnh báo sai nhưng có thể bỏ sót một số tai nạn.  
                                <br><br>
                                Hãy chọn giá trị phù hợp để hệ thống hoạt động hiệu quả nhất!
                            </span>
                        </span>
                    </label>
                    <input
                        type="range"
                        id="confidenceThreshold"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.70">
                    <span id="thresholdValue">0.70</span>
                </div>
            </div>

            <div class="accidents-section">
                <div class="accidents-header">
                    <h2>CÁC TAI NẠN ĐÃ PHÁT HIỆN</h2>
                    <div class="accidents-actions">
                        <button id="viewAllAccidents" class="btn btn-secondary" style="display:none; margin-right: 10px;">
                            Xem Tất Cả
                        </button>
                        <button id="clearAccidentHistory" class="btn btn-secondary" style="display:none;">
                            Xóa Lịch Sử
                        </button>
                    </div>
                </div>
                <div id="accidentsList" class="accidents-list">
                    <!-- Các tai nạn sẽ được thêm vào đây động -->
                </div>
            </div>
         
        </div>
    </div>
    
    <!-- Template cho showAccidentDetailsModal -->
    <template id="accident-details-template">
        <div class="modal-body">
            <div class="detection-preview">
                <img id="detectionImage" src="" alt="Ảnh Phát Hiện Tai Nạn">
                <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f1f2f6; border-radius: 8px;">
                    <div class="detail-item">
                        <strong>🚑 Đội cứu hộ FAS Angel:</strong> 0822 510 627  
                    </div>
                    <div class="detail-item">
                        <strong>🚓 Cảnh sát giao thông:</strong> 113  
                    </div>
                </div>
                <div style="width: 100%">
                    <button id="directionsToAccidentBtn" class="btn btn-primary">📍 Chỉ Đường</button>
                </div>
            </div>

            <div class="detection-details">
                <div class="detail-item">
                    <strong>Độ Tin Cậy:</strong>
                    <span id="confidence-value"></span>
                </div>
                <div class="detail-item">
                    <strong>Thời Gian Phát Hiện:</strong>
                    <span id="timestamp-value"></span>
                </div>
                <div class="detail-item">
                    <strong>Địa Chỉ Chi Tiết:</strong>
                    <span id="address-value"></span>
                </div>
                <div class="detail-item">
                    <strong>Tọa Độ Camera:</strong>
                    <span id="coordinates-value"></span>
                </div>
                <div class="detail-item">
                    <strong>Khoảng Cách:</strong>
                    <span id="distance-value"></span>            
                </div>
                <div class="detail-item">
                    <strong>Bệnh viện gần vị trí tai nạn:</strong>  
                    <button id="findNearestHospitalBtn" class="btn btn-primary">🏥 Tìm bệnh viện</button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button id="closeAccidentDetailsBtn" class="btn btn-secondary">Đóng</button>
        </div>
    </template>

    <!-- Template cho showAccidentModal -->
    <template id="new-accident-template">
        <div class="modal-body">
            <div class="detection-preview">
                <img id="detectionImage" src="" alt="Ảnh Phát Hiện Tai Nạn">
                <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f1f2f6; border-radius: 8px;">
                    <div class="detail-item">
                        <strong>🚑 Đội cứu hộ FAS Angel:</strong> 0822 510 627  
                    </div>
                    <div class="detail-item">
                        <strong>🚓 Cảnh sát giao thông:</strong> 113  
                    </div>
                </div>
                <div style="width: 100%">
                    <button id="directionsToAccidentBtn" class="btn btn-primary">📍 Chỉ Đường</button>
                </div>
            </div>

            <div class="detection-details">
                <div class="detail-item">
                    <strong>Độ Tin Cậy:</strong>
                    <span id="confidence-value"></span>
                </div>
                <div class="detail-item">
                    <strong>Thời Gian Phát Hiện:</strong>
                    <span id="timestamp-value"></span>
                </div>
                <div class="detail-item">
                    <strong>Địa Chỉ Chi Tiết:</strong>
                    <span id="address-value"></span>
                </div>
                <div class="detail-item">
                    <strong>Tọa Độ Camera:</strong>
                    <span id="coordinates-value"></span>
                </div>
                <div class="detail-item">
                    <strong>Khoảng Cách:</strong>
                    <span id="distance-value"></span>            
                </div>
                <div class="detail-item">
                    <strong>Bệnh viện gần vị trí tai nạn:</strong>  
                    <button id="findNearestHospitalBtn" class="btn btn-primary">🏥 Tìm bệnh viện</button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button onclick="confirmAccident(true)" class="btn btn-primary">✅ Xác Nhận Tai Nạn</button>
            <button onclick="confirmAccident(false)" class="btn btn-secondary">❌ Không Phải Tai Nạn</button>
        </div>
    </template>

    <!-- Modal containers -->
    <div id="accidentModal" class="modal">
        <div class="accident-modal-content">
            <!-- Content will be cloned from templates -->
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
